[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retinal-ftd-prediction"
version = "0.1.0"
description = "Donor-aware retinal research pipeline with synthetic preflight checks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
ftd-prediction = "ftd_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
